# Unified ChaosLab Orchestration
x-chaos-env: &chaos-env
  env_file: backend/.env
  environment:
    CHAOS_DATABASE_URL: postgresql+psycopg://chaos:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in backend/.env}@postgres:5432/chaos
    CHAOS_REDIS_URL: redis://redis:6379/0

services:
  frontend:
    build:
      context: frontend
      args:
        VITE_API_BASE_URL: http://localhost:8000
        VITE_API_TOKEN: "IMBI9MwihUQjmWN3qvBlVvyRcW-IutrhlWZCpRVZlK8"
    ports:
      - "3000:80"
    networks: [api-net]
    depends_on:
      - api

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: chaos
      POSTGRES_DB: chaos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in backend/.env}
    volumes: [pgdata:/var/lib/postgresql/data]
    networks: [control-net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chaos"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7
    networks: [control-net]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  migrate:
    build: backend
    <<: *chaos-env
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres: {condition: service_healthy}
    networks: [control-net]
    restart: "no"

  api:
    build: backend
    <<: *chaos-env
    environment:
      CHAOS_DATABASE_URL: postgresql+psycopg://chaos:${POSTGRES_PASSWORD}@postgres:5432/chaos
      CHAOS_REDIS_URL: redis://redis:6379/0
      CHAOS_TOXIPROXY_URL: ${CHAOS_TOXIPROXY_URL:-}
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    networks: [api-net, control-net, fault-mgmt, app-net]
    volumes:
      - artifacts:/var/lib/chaos/artifacts
      - /var/run/docker.sock:/var/run/docker.sock
    user: "0:0"

  worker:
    build: backend
    <<: *chaos-env
    environment:
      CHAOS_DATABASE_URL: postgresql+psycopg://chaos:${POSTGRES_PASSWORD}@postgres:5432/chaos
      CHAOS_REDIS_URL: redis://redis:6379/0
      CHAOS_WORKER_ID: worker-1
    command: ["rq", "worker", "chaos", "--url", "redis://redis:6379/0", "--with-scheduler"]
    depends_on:
      migrate: {condition: service_completed_successfully}
    networks: [control-net, fault-mgmt, app-net]
    volumes:
      - artifacts:/var/lib/chaos/artifacts
      - /var/run/docker.sock:/var/run/docker.sock
    user: "0:0"

  reconciler:
    build: backend
    <<: *chaos-env
    environment:
      CHAOS_DATABASE_URL: postgresql+psycopg://chaos:${POSTGRES_PASSWORD}@postgres:5432/chaos
      CHAOS_REDIS_URL: redis://redis:6379/0
    command: ["python", "-m", "app.workers.reconciler"]
    depends_on:
      migrate: {condition: service_completed_successfully}
    networks: [control-net, fault-mgmt, app-net]
    volumes:
      - artifacts:/var/lib/chaos/artifacts
      - /var/run/docker.sock:/var/run/docker.sock
    user: "0:0"

  # ---- optional disposable test bed ----
  toxiproxy:
    profiles: [testbed]
    image: ghcr.io/shopify/toxiproxy:2.9.0
    networks:
      fault-mgmt: {}
      app-net: {}

  toxiproxy-init:
    profiles: [testbed]
    image: curlimages/curl:8.10.1
    depends_on: [toxiproxy]
    networks: [fault-mgmt]
    restart: "no"
    entrypoint: ["sh", "-c"]
    command:
      - >
        until curl -sf http://toxiproxy:8474/version; do sleep 1; done;
        curl -sf -X POST http://toxiproxy:8474/proxies
        -d '{"name":"payment-http","listen":"0.0.0.0:8000","upstream":"payment-service:80","enabled":true}'
        || curl -sf http://toxiproxy:8474/proxies/payment-http

  payment-service:
    profiles: [testbed]
    image: nginx:1.27-alpine
    container_name: payment-service
    networks: [app-net]

networks:
  api-net: {}
  control-net: {internal: true}
  fault-mgmt: {internal: true}
  app-net: {internal: true}

volumes:
  pgdata: {}
  artifacts: {}
