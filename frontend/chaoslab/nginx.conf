server{listen 80;root /usr/share/nginx/html;index index.html;autoindex off;
add_header X-Content-Type-Options nosniff;add_header X-Frame-Options DENY;add_header Referrer-Policy no-referrer;
location /assets/{add_header Cache-Control "public,max-age=31536000,immutable";}
location /{try_files $uri /index.html;}}
