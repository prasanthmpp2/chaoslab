[project]
name = "chaos-platform-backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic==1.14.0",
    "chaostoolkit==1.19.0",
    "docker==7.1.0",
    "fastapi==0.115.6",
    "httpx==0.28.1",
    "kubernetes==31.0.0",
    "prometheus-client==0.21.1",
    "psycopg[binary]==3.2.3",
    "pydantic==2.10.4",
    "pydantic-settings==2.7.0",
    "pytest==8.3.4",
    "pytest-asyncio==0.25.0",
    "pyyaml==6.0.2",
    "redis==5.2.1",
    "rq==2.1.0",
    "ruff==0.8.4",
    "sqlalchemy==2.0.36",
    "uvicorn[standard]==0.34.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["integration: touches real Docker/Kubernetes/Toxiproxy; requires CHAOS_INTEGRATION=1"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008", "B039"]
