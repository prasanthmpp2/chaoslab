apiVersion: chaos.example.io/v1
kind: Experiment
metadata:
  name: payment-container-kill
  version: "1"
spec:
  target:
    environment: docker-test
    service: payment-service
  fault:
    engine: pumba
    type: container-kill
    parameters:
      signal: SIGKILL
    durationSeconds: 15
  hypothesis:
    maxErrorRate: 0.5
    requireRecovery: true
  safety:
    environmentAllowlist: [docker-test]
    maxDurationSeconds: 30
  probes:
    - name: payment-container
      type: container-state
      container: payment-service
      samples: 3
